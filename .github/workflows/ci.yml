name: CI / CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with JaCoCo
        working-directory: backend/pulsestack
        run: mvn -B verify --no-transfer-progress
        env:
          PULSESTACK_JWT_SECRET: test-secret-key-must-be-at-least-32-chars
          PULSESTACK_JWT_EXPIRATION_MS: 3600000

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            backend/pulsestack/*/target/site/jacoco/
          retention-days: 14

      - name: Coverage summary (ingestion-service)
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: backend/pulsestack/ingestion-service/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 50
          title: Coverage — ingestion-service

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Deploy ist best-effort und darf die gruene Test-Pipeline nicht rot faerben:
      # ein fehlendes Secret wird uebersprungen, ein fehlschlagender Hook (z. B.
      # suspendierter Render-Service) wird als Warnung im Step-Log sichtbar,
      # blockiert aber die uebrigen Services nicht.
      - name: Deploy auth-service
        continue-on-error: true
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_AUTH }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_AUTH not set — skipping auth-service."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 60 "$HOOK"

      - name: Deploy ingestion-service
        continue-on-error: true
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_INGESTION }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_INGESTION not set — skipping ingestion-service."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 60 "$HOOK"

      - name: Deploy processing-service
        continue-on-error: true
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_PROCESSING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_PROCESSING not set — skipping processing-service."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 60 "$HOOK"

      - name: Deploy chat-service
        continue-on-error: true
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_CHAT }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_CHAT not set — skipping chat-service."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 60 "$HOOK"
