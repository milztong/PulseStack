name: Keep Processing Service Alive

on:
  schedule:
    # GitHub cron uses UTC. Run away from the top of the hour and enforce the
    # actual weekday/time window in Europe/Berlin in the step below.
    - cron: '7-57/10 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulsestack-processing-keep-alive
  cancel-in-progress: true

jobs:
  ping-processing:
    name: Ping processing-service
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROCESSING_HEALTH_URL: https://pulsestack.onrender.com/actuator/health

    steps:
      - name: Check demo window
        id: demo-window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_ping=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: pinging independently of the demo window."
            exit 0
          fi

          berlin_weekday="$(TZ=Europe/Berlin date +%u)"
          berlin_hour="$(TZ=Europe/Berlin date +%H)"

          if (( berlin_weekday <= 5 && 10#$berlin_hour >= 8 && 10#$berlin_hour < 22 )); then
            echo "should_ping=true" >> "$GITHUB_OUTPUT"
            echo "Inside the weekday demo window (08:00-22:00 Europe/Berlin)."
          else
            echo "should_ping=false" >> "$GITHUB_OUTPUT"
            echo "Outside the weekday demo window; skipping the ping."
          fi

      - name: Ping processing health endpoint
        if: steps.demo-window.outputs.should_ping == 'true'
        shell: bash
        run: |
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 120 \
            "$PROCESSING_HEALTH_URL"
